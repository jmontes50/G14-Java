<!DOCTYPE html>
<html lang="es">

<head>
  <title>Forms</title>
  <meta charset="utf-8">
</head>

<body>
  <header>
    <h1>Formulario de registro</h1>
  </header>
  <main>
    <form>
      <label for="input-nombre">Nombres completos</label>
      <input 
        type="text"
        placeholder="Ej. Juan"
        id="input-nombre"
        value=""
        name="nombre"
      >
      <!-- br - break - salto de línea-->
      <br>
      <label for="input-email">Correo electrónico</label>
      <input
        type="email"
        placeholder="Ej.user@gmail.com"
        id="input-email"
        name="email"
      >
      <br>
      <label for="input-password">Contraseña</label>
      <input
        type="password"
        placeholder="Se requieren al menos 6 caracteres"
        id="input-password"
        name="password"
      >
      <br>
      <label for="input-edad">Edad</label>
      <input
        type="number"
        placeholder="Ej. 25"
        id="input-edad"
        name="edad"
      >
      <br>
      <label for="input-fecha">Fecha de nacimiento</label>
      <input
        type="date"
        id="input-fecha"
        name="fecha"
      >
      <br>
      <div>
        <h4>Género</h4>
        <input type="radio" id="genero-masculino" name="genero">
        <label for="genero-masculino" name="">Masculino</label>
        <input type="radio" id="genero-femenino" name="genero">
        <label for="genero-femenino" name="">Femenino</label>
        <input type="radio" id="genero-no-compartir" name="genero">
        <label for="genero-no-compartir" name="">Prefiero no compartir</label>
      </div>
      <div>
        <h4>Hobbies</h4>
        <input type="checkbox" id="hobby-cine" name="hobby">
        <label for="hobby-cine" name="">Cine</label>
        <input type="checkbox" id="hobby-deporte" name="hobby">
        <label for="hobby-deporte" name="">Deporte</label>
        <input type="checkbox" id="hobby-musica" name="hobby">
        <label for="hobby-musica" name="">Música</label>
        <input type="checkbox" id="hobby-lectura" name="hobby">
        <label for="hobby-lectura" name="">Lectura</label>
      </div>
      <button type="submit">Enviar</button>
    </form>
  </main>
</body>

</html>
