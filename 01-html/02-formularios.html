<!DOCTYPE html>
<html lang="es">

<head>
  <title>Forms</title>
  <meta charset="utf-8">
</head>

<body>
  <header>
    <h1>Formulario de registro</h1>
  </header>
  <main>
    <form>
      <label for="input-nombre">Nombres completos</label>
      <input 
        type="text"
        placeholder="Ej. Juan"
        id="input-nombre"
        value=""
        name="nombre"
      >
      <!-- br - break - salto de línea-->
      <br>
      <label for="input-email">Correo electrónico</label>
      <input
        type="email"
        placeholder="Ej.user@gmail.com"
        id="input-email"
        name="email"
      >
      <br>
      <label for="input-password">Contraseña</label>
      <input
        type="password"
        placeholder="Se requieren al menos 6 caracteres"
        id="input-password"
        name="password"
      >
      <br>
      <button type="submit">Enviar</button>
    </form>
  </main>
</body>

</html>
